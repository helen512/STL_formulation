[workspace]
channels = ["conda-forge"]
name = "lerobot-libero"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
lerobot = { version = ">=0.6.1, <0.7", extras = ["libero", "pi", "evaluation"] }
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu118" }
torchvision = { version = "==0.22.1", index = "https://download.pytorch.org/whl/cu118" }
torchcodec = ">=0.5.0,<0.6"
